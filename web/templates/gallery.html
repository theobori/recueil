<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>{{.Title}}</title>
    <link rel="stylesheet" type="text/css" href="/gallery.css">
    <link rel="feed" type="application/rss+xml" title="{{ .Title }}" href="/rss.xml">
  </head>
  <body>
    <header>
      <nav>
        <h1>{{.Title}}</h1>
      </nav>
    </header>
    <main>
      <div id="recueil-tags">
	<a href="/">/</a>{{range .Tags}}
        <a href="{{$.TagsDirectory}}/{{.}}.html">{{.}}</a>{{else}}{{end}}
      </div>
      <div id="recueil-thumbnails">{{range .Metadatas}}
        <a id="{{ .Title }}" href="{{ .Destination.HtmlPath.PublicValue }}">
          <img id="{{ .Title }}" class="recueil-thumbnail"{{ if .Description }} title="{{ .Description }}"{{end}}{{ if .Description }} alt="{{ .Description }}"{{end}} src="{{ .Destination.ThumbnailPath.PublicValue }}" loading="lazy">
        </a>{{else}}
        <div><i>The recueil is empty.</i></div>{{end}}
      </div>
    </main>
    <footer>
      <a href="/">/</a>
      <a href="/rss.xml">rss</a>{{ range .Webrings }}
      <a href="{{ .Url }}">{{ .Title }}</a>{{else}}{{end}}
      <a href="#">top</a>
    </footer>
  </body>
</html>
